name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matchgrid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite refuses to run unless the database name ends in _test.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/matchgrid_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/matchgrid_test
      # CI-only value; add any other settings required by app/core/config.py here.
      SECRET_KEY: ci-only-secret-key-for-tests-0123456789abcdef
      # Redis is replaced by fakeredis in tests; the app only needs the setting to exist.
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create the test schema
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q